
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11주차 jQuery</title>

    <!-- jQuery 라이브러리 연결 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .c1 {
            color: red;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: lightgray;
            margin: 10px 0;
        }

        .effectBox {
            width: 200px;
            height: 100px;
            background-color: orange;
            margin: 10px 0;
        }
    </style>

    <script>
        $(document).ready(function() { // 문서가 준비(페이지 로딩)되면 실행되는 함수

            // 1. 문서 객체 선택
            $("#btn1").click(function() {
                $(".selectText").css("color", "red");
                $(".selectText").css("backgroundColor", "black"); 
            });


            // 2. 문서 객체 속성 조작 - attr()
            $("#btn2").click(function() {
                $("img").attr("src", "https://placehold.co/200x200");
            });


            // 3. 문서 객체 내부 글자 조작 - text(), html()
            $("#btn3").click(function() {
                $("#t1").text('<a href="https://www.syu.ac.kr">text()</a>');
                $("#t2").html('<a href="https://www.syu.ac.kr">html()</a>');
            });


            // 4. 클래스 조작 - addClass(), removeClass(), toggleClass()
            $("#btn4").click(function() {
                $("#classText").addClass("c1");
            });

            $("#btn5").click(function() {
                $("#classText").removeClass("c1");
            });

            $("#btn6").click(function() {
                $("#classText").toggleClass("c1");
            });
        });
    </script>
</head>

<body>
    <h1>jQuery 실습</h1>

    <h2>1. 문서 객체 선택</h2>
    <p class="selectText">삼육대학교</p>
    <p class="selectText">인공지능융합학부</p>
    <p class="selectText">웹프로그래밍</p>
    <button id="btn1">스타일 변경</button>

    <hr>

    <h2>2. 속성 조작 attr()</h2>
    <img><br>
    <img src="https://placehold.co/100x100"><br>
    <button id="btn2">이미지 속성 변경</button>

    <hr>

    <h2>3. 내부 글자 조작</h2>
    <p id="t1">삼육대학교</p>
    <p id="t2">인공지능융합학부</p>
    <button id="btn3">글자 변경</button>

    <hr>

    <h2>4. 클래스 조작</h2>
    <p id="classText">클래스 변경 테스트</p>
    <button id="btn4">클래스 추가</button>
    <button id="btn5">클래스 제거</button>
    <button id="btn6">클래스 전환</button>

    <hr>

</body>
</html>
