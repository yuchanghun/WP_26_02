\<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10주차 javascript</title>

    <script>
        // 함수 선언 및 호출
        function hello() {
            alert("Hello!");
        }

        hello();


        // 익명 함수
        let sum = function(a, b) {
            return a + b;
        };

        let result = sum(3, 5);
        console.log(result);


        // 화살표 함수
        let hello2 = () => {
            alert("Hello!");
        };

        let greet = name => {
            alert("Hello, " + name + "!");
        };

        let add = (a, b) => {
            return a + b;
        };

        console.log(add(3, 5));


        // 매개변수와 반환값
        function add2(x, y) {
            return x + y;
        }

        let result2 = add2(3, 5);
        console.log(result2);


        // 매개변수 기본값 설정
        function multiple(a, b = 5, c = 10) {
            return a + b + c;
        }

        let res1 = multiple(3, 7, 2);
        let res2 = multiple(3, 7);
        let res3 = multiple(3);

        console.log(res1);
        console.log(res2);
        console.log(res3);


        // 콜백 함수
        function callFiveTimes(callback) {
            for (let i = 0; i < 5; i++) {
                callback();
            }
        }

        callFiveTimes(function() {
            console.log("콜백 함수 호출됨");
        });


        // 객체 생성 및 속성 접근
        let student = {
            name: "홍길동",
            age: 20,
            major: "인공지능융합"
        };

        console.log(student["name"]);
        console.log(student["age"]);
        console.log(student["major"]);

        console.log(student.name);
        console.log(student.age);
        console.log(student.major);


        // 객체 메소드와 this
        let person = {
            name: "홍길동",
            age: 20,
            introduce: function() {
                console.log("이름: " + this.name);
                console.log("나이: " + this.age);
            }
        };

        person.introduce();


        // Array 객체 - 배열 생성
        let arr1 = new Array();
        let arr2 = [];
        let arr3 = new Array(5);

        let arr4 = new Array(1, 2, 3);
        let arr5 = [1, 2, 3];

        console.log(arr4);
        console.log(arr5);


        // Array 객체 메소드
        let numbers = [1, 2, 3, 4, 5];

        numbers.push(6);
        console.log(numbers);

        numbers.pop();
        console.log(numbers);

        numbers.unshift(0);
        console.log(numbers);

        numbers.shift();
        console.log(numbers);

        console.log(numbers.join(","));
        console.log(numbers.slice(1, 3));
        console.log(numbers.indexOf(3));


        // Date 객체
        let now = new Date();
        let specificDate = new Date(2025, 0, 1, 0, 0, 0);
        let dateString = new Date("2025-01-01");
        let dateTimeString = new Date("2025-01-01T12:00:00");

        console.log(now);
        console.log(specificDate);
        console.log(dateString);
        console.log(dateTimeString);

        console.log(now.getFullYear());
        console.log(now.getMonth() + 1);
        console.log(now.getDate());
        console.log(now.getDay());
        console.log(now.getHours());
        console.log(now.getMinutes());
        console.log(now.getSeconds());


        // Math 객체
        console.log(Math.PI);
        console.log(Math.E);

        console.log(Math.abs(-10));
        console.log(Math.ceil(3.2));
        console.log(Math.floor(3.8));
        console.log(Math.round(3.5));
        console.log(Math.max(10, 20, 30));
        console.log(Math.min(10, 20, 30));
        console.log(Math.pow(2, 3));
        console.log(Math.sqrt(16));
        console.log(Math.random());


        // BOM - window 객체
        console.log(window.innerWidth);
        console.log(window.innerHeight);
        console.log(window.outerWidth);
        console.log(window.outerHeight);


        // BOM - navigator 객체
        console.log(navigator.language);
        console.log(navigator.userAgent);
        console.log(navigator.onLine);


        // BOM - history 객체
        console.log(history.length);


        // BOM - location 객체
        console.log(location.href);
        console.log(location.hostname);
        console.log(location.pathname);
        console.log(location.protocol);


        // BOM - screen 객체
        console.log(screen.width);
        console.log(screen.height);
        console.log(screen.availWidth);
        console.log(screen.availHeight);
        console.log(screen.colorDepth);

    </script>
</head>
<body>
    <h1 id="title">Javascript 실습</h1>

    <p class="item">첫 번째 문단</p>
    <p class="item">두 번째 문단</p>
    <p>세 번째 문단</p>
</body>
</html>
