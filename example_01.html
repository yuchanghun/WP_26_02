<!--문서가 HTML5 문서임을 알려줌-->
<!DOCTYPE html>\

<!--html 태그: 최상위 요소, lang 속성입력가능-->
<html lang="KO">

<!--head 태그: 문서에 필요한 추가정보제공, 사용자에게 보이지 않음-->
<head>
    <!--meta 태그: 웹페이지 추가정보, charset: 문자코드(거의 UTF-8 사용)-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--title 태그: 문서제목-->
    <title>HTML5 Basic Page</title>
</head>

<!--body 태그: 사용자에게 실제 보여지는 부분-->
<body>
    <h1>안녕하세요.</h1>
</body>
</html>
