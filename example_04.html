<!DOCTYPE html>
<html lang="KO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>3주차_목록태그</title>
</head>
<body>
    <h1>글머리 기호</h1>
        <ul type="circle">
            <li>HTML</li>
            <li>CSS</li>
            <li>JS</li>
        </ul>
    <h1>순서번호 목록</h1>
        <ol type="a", start="4">
            <li>HTML</li>
            <li>CSS</li>
            <li>JS</li>
        </ol>
    <h1>정의 목록</h1>
        <dl>
            <dt>프론트엔드</dt>
            <dd>HTML</dd>
            <dd>CSS</dd>
            <dd>JS</dd>
            <dt>백엔드</dt>
            <dd>Node.js</dd>
            <dd>MySQL</dd>
        </dl>


</body>
</html>
